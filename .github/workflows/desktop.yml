name: Desktop verification and release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      revision:
        description: Source revision to build (commit, branch or tag)
        required: true
        default: main
      publish:
        description: Create a draft GitHub Release after all native checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  revision:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - id: source
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/') and ref != 'refs/tags/v' + version:
              raise SystemExit('Tag and package version must agree')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nversion={version}\n')
          PY

  native:
    needs: revision
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.revision.outputs.sha }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Linux display and package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb rpm cpio libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - name: Install controlled desktop build dependencies
        run: |
          python -m pip install -r packaging/requirements-desktop.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Lint, complexity and security gates
        run: |
          python -m ruff check pop_linux tests packaging
          python -m ruff check --select C901 pop_linux/gui packaging pop_linux/config.py pop_linux/execution.py pop_linux/providers/capabilities.py pop_linux/providers/google_scholar.py tests/test_desktop_engine.py tests/test_gui.py
          python -m bandit -r pop_linux packaging -ll
          pop-linux --help
      - name: Regression and GUI integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build/test-artifacts build/gui-artifacts
          python -m pytest -q --basetemp=build/test-artifacts --junitxml=build/test-results.xml
          python -m pytest tests/test_gui.py -q --basetemp=build/gui-artifacts
      - name: Build and start native packages on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build_desktop.py
      - name: Build and start native packages on Windows and macOS
        if: runner.os != 'Linux'
        run: python packaging/build_desktop.py
      - name: Retain native packages, startup screenshots and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain test evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/gui-artifacts/
          if-no-files-found: warn

  release:
    needs: [revision, native]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Validate every platform package and startup evidence
        env:
          VERSION: ${{ needs.revision.outputs.version }}
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
        run: python packaging/verify_release.py release-assets "$VERSION" "$SOURCE_SHA"
      - name: Create draft release from the verified source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.revision.outputs.version }}
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp docs/release-0.2.0.md release-notes.md
          python - <<'PY'
          import os
          with open('release-notes.md', 'a') as output:
              output.write('\nSource commit: ' + os.environ['SOURCE_SHA'] + '\nBuild workflow: ' + os.environ['WORKFLOW_URL'] + '\n')
          PY
          gh release create "v$VERSION" release-assets/* --draft --target "$SOURCE_SHA" --title "Perish or Publish $VERSION" --notes-file release-notes.md
          gh release view "v$VERSION" --json url,assets,isDraft
