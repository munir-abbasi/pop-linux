[build-system]
requires = ["setuptools>=77.0.3,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "pop-linux"
version = "0.2.0"
description = "Python scholarly search and bibliometrics with a CLI and optional Qt desktop workspace."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = [
    "bibliometrics",
    "h-index",
    "g-index",
    "citation-analysis",
    "google-scholar",
    "openalex",
    "semantic-scholar",
    "crossref",
    "pubmed",
    "harzing",
    "publish-or-perish",
    "linux",
    "scholarly-search",
]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
authors = [
    {name = "Munir Abbasi", email = "info@syntaxhouse.com"}
]
dependencies = [
    "typer>=0.9.0,<1.0",
    "rich>=13.0.0,<15.0",
    "pydantic>=2.0.0,<3.0",
    "httpx>=0.24.0,<1.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "playwright>=1.35.0,<2.0",
    "tomli-w>=1.0.0,<2.0"
]

[project.optional-dependencies]
desktop = ["PySide6==6.11.2"]
desktop-test = ["PySide6==6.11.2"]
desktop-build = ["PySide6==6.11.2", "pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9"]

[project.urls]
Homepage = "https://github.com/munir-abbasi/pop-linux"
Repository = "https://github.com/munir-abbasi/pop-linux"
"Bug Tracker" = "https://github.com/munir-abbasi/pop-linux/issues"
"Chromium Download" = "https://playwright.dev/docs/browsers"

[project.scripts]
pop-linux = "pop_linux.cli:app"
pop-linux-gui = "pop_linux.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pop_linux*"]

[tool.setuptools.package-data]
"pop_linux.gui" = ["resources/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
ignore = ["BLE001", "S110", "B904", "E501", "B008"]
select = ["E", "F", "W", "B"]
